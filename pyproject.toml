[project]
name = "ctrader_open_api"
version = "0.0.0"
description = "A Python package for interacting with cTrader Open API"
authors = [
    {name = "Spotware", email = "connect@spotware.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
]

dependencies = [
    "Twisted==24.3.0",
    "pyOpenSSL==24.1.0",
    "protobuf==3.20.1",
    "requests==2.32.3",
    "inputimeout==1.0.4",
    "ipykernel>=6.29.5",
    "pandas>=2.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "pylint",
]

[project.urls]
Homepage = "https://github.com/spotware/openApiPy"
Documentation = "https://spotware.github.io/OpenApiPy"

[tool.black]
line-length=100

[tool.pylint.reports]
output-format="colorized"
reports="y"
include-ids="yes"
msg-template="{msg_id}:{line:3d},{column}: {obj}: {msg}"

[tool.pytest.ini_options]
addopts = "--cov=ctrader_openApiPy --cov-branch --cov-report term-missing  -vv --color=yes --cov-fail-under 100"
python_files = "tests.py test_*.py *_tests.py"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"
